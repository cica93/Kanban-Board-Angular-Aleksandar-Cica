input UserInput {
  id: Int
  fullName: String
  email: String
  token: String
  password: String
  image: String
}

input TaskInput {
  id: Long!
  title: String!
  description: String!
  taskStatus: String!
  taskPriority: String!
  version: Int!
  taskOrder: Int!
  users: [UserInput!]!
}

input CreateTaskInput {
  title: String!
  description: String!
  taskStatus: String!
  taskPriority: String!
  users: [UserInput!]!
}


type User {
  id: Long!
  fullName: String!
  email: String!
}

type Task {
  id: Int!
  title: String!
  description: String!
  taskStatus: String!
  taskPriority: String!
  version: Int!
  taskOrder: Int!
  users: [User!]!
}

type OptionalTask {
  id: Int
  title: String
  description: String
  taskStatus: String
  taskPriority: String
  version: Int
  users: [User!]!
}

type Query {
  getTaskById(id: Int!): Task!
  getTasks(limit: Int!, offset: Int!, description: String): [Task!]!
}

type Mutation {
  createTask(task: CreateTaskInput!): OptionalTask
  updateTask(id: Int!, task: TaskInput!): OptionalTask
  deleteTask(id: Int!, version: Int!): OptionalTask
  dragTask(taskId: Int!, taskStatus: String!, taskOrder: Int!, taskVersion: Int): OptionalTask
}

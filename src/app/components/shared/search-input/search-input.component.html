<ion-list>
  <ion-item>
    <ion-input
      #searchInput
      fill="solid"
      [clearInput]="true"
      [placeholder]="placeholder()"
      [debounceTime]="debounceTime()"
      (appDebounceInput)="setInputValue($event)"
    >
      <ion-icon
        slot="start"
        [icon]="searchIcon"
      />
    </ion-input>
  </ion-item>
</ion-list>

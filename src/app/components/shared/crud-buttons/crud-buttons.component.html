@if (showEditButton()) {
  <button
    (click)="editEntity()"
    cicaTooltip="Edit {{ entityName() }}"
    [tooltipPosition]="'right'"
    [tooltipDisabled]="!!editText()"
    class="primary"
  >
  <span class="material-symbols-rounded">edit</span>
  @if(editText()){
  <span>{{editText()}}</span>
  }
  </button>
}
@if (showCreateButton()) {
  <button
    (click)="createEntity()"
    cicaTooltip="Create {{ entityName() }}"
    [tooltipPosition]="'right'"
    [tooltipDisabled]="!!createText()"
    class="primary"
  >
   <span class="material-symbols-rounded">add</span>
   @if(createText()){
   <span>{{createText()}}</span>
   }
  </button>
}

@if (showDeleteButton()) {
  <button
    cicaTooltip="Delete {{ entityName() }}"
    [tooltipPosition]="'right'"
    [tooltipDisabled]="!!deleteText()"
    (click)="deleteEntity()"
    class="danger"
  >
 <span class="material-symbols-rounded">delete</span>
 @if(deleteText()){
   <span>{{deleteText()}}</span>
 }
  </button>
}

@if (showClearButton()) {
  <button
    [cicaTooltip]="'Clear'"
    (click)="close()"
    class="danger"
  >
  <span class="material-symbols-rounded">close</span>
  </button>
}

@if(showEditButton()){
<ion-button
              (click)="editEntity()"
              [size]="'small'"
              appTooltip="Edit {{entityName()}}"
              [tooltipPosition]="'right'"
            >
              <ion-icon
                slot="icon-only"
                [icon]="createOutlineIcon"
              ></ion-icon>
            </ion-button>
          }
          @if(showCreateButton()){

            <ion-button
              (click)="createEntity()"
              [size]="'small'"
              appTooltip="Create {{entityName()}}"
              [tooltipPosition]="'right'"
            >
              <ion-icon
                slot="icon-only"
                [icon]="addIcon"
              ></ion-icon>
            </ion-button>
          }

          @if(showDeleteButton()){

            <ion-button
              appTooltip="Delete {{entityName()}}"
              [size]="'small'"
              [tooltipPosition]="'right'"
              [color]="'danger'"
              (click)="deleteEntity()"
            >
              <ion-icon
                slot="icon-only"
                [icon]="trashOutlineIcon"
              ></ion-icon>
            </ion-button>
          }

@if (showEditButton()) {
  <ion-button
    (click)="editEntity()"
    [size]="'small'"
    cicaTooltip="Edit {{ entityName() }}"
    [tooltipPosition]="'right'"
  >
    <ion-icon
      slot="icon-only"
      [icon]="createOutlineIcon"
    ></ion-icon>
  </ion-button>
}
@if (showCreateButton()) {
  <ion-button
    (click)="createEntity()"
    [size]="'small'"
    cicaTooltip="Create {{ entityName() }}"
    [tooltipPosition]="'right'"
  >
    <ion-icon
      slot="icon-only"
      [icon]="addIcon"
    ></ion-icon>
  </ion-button>
}

@if (showDeleteButton()) {
  <ion-button
    cicaTooltip="Delete {{ entityName() }}"
    [size]="'small'"
    [tooltipPosition]="'right'"
    [color]="'danger'"
    (click)="deleteEntity()"
  >
    <ion-icon
      slot="icon-only"
      [icon]="trashOutlineIcon"
    ></ion-icon>
  </ion-button>
}

@if (showClearButton()) {
  <ion-button
    appTooltip="Clear"
    [size]="'small'"
    [cicaTooltip]="'right'"
    [color]="'danger'"
    (click)="close()"
  >
    <ion-icon
      slot="icon-only"
      [icon]="closeIcon"
    ></ion-icon>
  </ion-button>
}

@if (showEditButton()) {
  <button
    (click)="editEntity()"
    cicaTooltip="Edit {{ entityName() }}"
    [tooltipPosition]="'right'"
    [tooltipDisabled]="!!editText()"
    class="primary"
  >
  <span [appSvgIcon]="'edit'"></span><span>{{editText()}}</span>
  </button>
}
@if (showCreateButton()) {
  <button
    (click)="createEntity()"
    cicaTooltip="Create {{ entityName() }}"
    [tooltipPosition]="'right'"
    [tooltipDisabled]="!!createText()"
    class="primary"
  >
   <span [appSvgIcon]="'create'"></span><span>{{createText()}}</span>
  </button>
}

@if (showDeleteButton()) {
  <button
    cicaTooltip="Delete {{ entityName() }}"
    [tooltipPosition]="'right'"
    [tooltipDisabled]="!!deleteText()"
    (click)="deleteEntity()"
    class="danger"
  >
  <span [appSvgIcon]="'delete'"></span><span>{{deleteText()}}</span>
  </button>
}

@if (showClearButton()) {
  <button
    [cicaTooltip]="'Clear'"
    (click)="close()"
    class="danger"
  >
  <span [appSvgIcon]="'close'"></span>
  </button>
}

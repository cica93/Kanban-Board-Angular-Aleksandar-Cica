<ion-header>
  <ion-toolbar>
    <ion-title>{{ header() }}</ion-title>

    <ion-buttons slot="end">
      <ion-button
        fill="clear"
        (click)="closeDialog()"
        aria-label="Close dialog"
      >
        <ion-icon
          slot="icon-only"
          [icon]="closeIcon"
        ></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  @if (textContent()) {
    <p>{{ textContent() }}</p>
  }
  <ng-content></ng-content> <ng-container #container></ng-container>
  <ion-footer>
    <ion-toolbar>
      <ion-buttons
        slot="end"
        class="dialog-actions"
      >
        <ion-button
          [size]="'large'"
          [fill]="'outline'"
          [color]="'danger'"
          (click)="closeDialog()"
        >
          {{ cancelLabel() ?? 'Cancel' }}
        </ion-button>
        <ion-button
          [size]="'large'"
          [strong]="true"
          [fill]="'outline'"
          [color]="'primary'"
          (click)="submitForm()"
        >
          {{ submitLabel() ?? 'Submit' }}
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-footer>
</ion-content>

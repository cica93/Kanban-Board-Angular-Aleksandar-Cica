<app-sidebar-wrapper
  [size]="sidebarSize()"
  [theme]="sidebarTheme()"
  [position]="sidebarPosition()"
>
  <ion-avatar class="cursor-pointer avatar logo-image-sm">{{
    user().fullName | slice: 0 : 1
  }}</ion-avatar>
  <img
    src="../../../assets/images/image.png"
    width="220"
    height="90"
    class="logo-image-lg"
  />
 
  <app-sidebar-link
    [icon]="'grid_on'"
    [label]="'Board'"
    [childLinks]="[
      { url: '/rest', label: 'Rest' },
      { url: '/graphql', label: 'Graphql' },
    ]"
  />
  <app-sidebar-link
    [icon]="'table_view'"
    [label]="'Table'"
    [url]="'/table'"
  />
   <app-sidebar-link
    [icon]="'group'"
    [url]="'/users'"
  >
  <ng-template #labelTemplate>
    <div class="user-label-wrapper">
       <label>Users</label>
       <label class="info">1</label>
    </div>
  </ng-template>  
</app-sidebar-link>
  <app-sidebar-link
    [icon]="'help'"
    [label]="'Setup'"
    [url]="'/setup'"
  />
  <app-sidebar-link
    [style.marginTop]="sidebarPosition() === 'top' ? 'unset' : 'auto'"
    [style.marginLeft]="sidebarPosition() === 'top' ? 'auto' : 'unset'"
    (linkClick)="logout.emit()"
    [icon]="'logout'"
    [label]="'Logout'"
  />
</app-sidebar-wrapper>

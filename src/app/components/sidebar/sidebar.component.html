<aside class="sidebar">
  <div class="sidebar-header">
    <ion-avatar class="cursor-pointer avatar">{{ user().fullName | slice: 0 : 1 }}</ion-avatar>
    <button
      (click)="toggleMenu()"
      class="sidebar-toggler"
      aria-label="Toggle Sidebar"
    >
      <span class="material-symbols-rounded">chevron_left</span>
    </button>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-list primary-nav">
      <app-sidebar-link
        [icon]="'group'"
        [label]="'Users'"
        [url]="'/users'"
      />
      <app-sidebar-link
        [icon]="'grid_on'"
        [label]="'Board'"
        [childLinks]="[
          { url: '/rest', label: 'Rest' },
          { url: '/graphql', label: 'Graphql' },
        ]"
      />
      <app-sidebar-link
        [icon]="'table_view'"
        [label]="'Table'"
        [url]="'/table'"
      />
      <app-sidebar-link
        [icon]="'help'"
        [label]="'Setup'"
        [url]="'/setup'"
      />
      <app-sidebar-link
        (linkClick)="logout.emit()"
        [icon]="'logout'"
        [label]="'Logout'"
      />
    </div>
  </nav>
</aside>

<cica-sidebar-wrapper
  [size]="sidebarSize()"
  (sizeChange)="sizeChange($event)"
  [position]="sidebarPosition()"
>
  <div
    class="logo-image-sm"
    style="height: 90px; display: flex; align-items: center; justify-content: center;"
  >
    <cica-avatar class="cursor-pointer avatar">{{ user().fullName | slice: 0 : 1 }}</cica-avatar>
  </div>

  <img
    src="/assets/images/image.png"
    width="220"
    height="90"
    class="logo-image-lg"
  />

  <cica-sidebar-link [label]="'Board'">
    <span class="material-symbols-rounded link-icon">grid_on</span>
    <ng-template
      cicaSidebarLink
      [url]="'/rest'"
    >
      Rest <span class="info">4</span>
    </ng-template>
    <ng-template
      cicaSidebarLink
      [url]="'/graphql'"
      >Graphql <span class="info">6</span></ng-template
    >
  </cica-sidebar-link>
  <cica-sidebar-link
    [label]="'Table'"
    [url]="'/table'"
  >
    <span class="material-symbols-rounded link-icon">table_view</span>
  </cica-sidebar-link>
  <cica-sidebar-link [url]="'/users'">
    <span class="material-symbols-rounded link-icon">group</span>
    <ng-template #labelTemplate>
      <div class="user-label-wrapper">
        <label>Users</label>
        <label class="info">1</label>
      </div>
    </ng-template>
  </cica-sidebar-link>
  <cica-sidebar-link
    [label]="'Setup'"
    [url]="'/setup'"
  >
    <span class="material-symbols-rounded link-icon">help</span>
  </cica-sidebar-link>
  <cica-sidebar-link
    [style.marginTop]="sidebarPosition() === 'top' ? 'unset' : 'auto'"
    [style.marginLeft]="sidebarPosition() === 'top' ? 'auto' : 'unset'"
    (linkClick)="logout.emit()"
    [label]="'Logout'"
  >
    <span class="material-symbols-rounded link-icon">logout</span>
  </cica-sidebar-link>
</cica-sidebar-wrapper>

<form [formRoot]="form" class="center-content">
      <cica-input
        [attr.id]="'title'"
        [errorMessage]="form.title().errors()[0]?.message"
        [label]="'Title'"
        [formField]="form.title"
      ></cica-input>
  
      <textarea  placeholder="Enter description" [formField]="form.description" 
      id="Description"></textarea>


      <app-select
        [id]="'task-status'"
        [items]="TASK_STATUSES_OPTIONS"
        [openOnEnter]="true"
        [bindLabel]="'label'"
        [bindValue]="'value'"
        [formField]="form.taskStatus"
        [placeholder]="'Select task status'"
        [clearable]="false"
        [searchable]="false"
      />
      <app-select
        [id]="'task-priority'"
        [items]="[...TASK_PRIORITIES]"
        [openOnEnter]="true"
        [formField]="form.taskPriority"
        [placeholder]="'Select task priority'"
        [clearable]="false"
        [searchable]="false"
      />
      @let users = (users$ | async) ?? [];
      <app-select
        [id]="'users'"
        [multiple]="true"
        [items]="users"
        [bindLabel]="'fullName'"
        [openOnEnter]="true"
        [attr.id]="'users'"
        [formField]="form.users"
        [placeholder]="'Select users'"
        [clearable]="false"
        [clearOnBackspace]="false"
      />
   
</form>

<form [formRoot]="form" class="center-content">
   <cica-form-field-wrapper label="Title">
      <cica-input
        [attr.id]="'title'"
        [label]="'Title'"
        [formField]="form.title"
      ></cica-input>
      </cica-form-field-wrapper>
  
      <cica-form-field-wrapper label="Description">
        <cica-input  placeholder="Enter description" [formField]="form.description" inputType="textarea"
          id="Description">
        </cica-input>
      </cica-form-field-wrapper>
    

<cica-form-field-wrapper label="Status">
      <app-select
        [id]="'task-status'"
        [items]="TASK_STATUSES_OPTIONS"
        [openOnEnter]="true"
        [bindLabel]="'label'"
        [bindValue]="'value'"
        [formField]="form.taskStatus"
        [placeholder]="'Select task status'"
        [clearable]="false"
        [searchable]="false"
      />
      </cica-form-field-wrapper>
      <cica-form-field-wrapper label="Priorities">
      <app-select
        [id]="'task-priority'"
        [items]="[...TASK_PRIORITIES]"
        [openOnEnter]="true"
        [formField]="form.taskPriority"
        [placeholder]="'Select task priority'"
        [clearable]="false"
        [searchable]="false"
      />
      </cica-form-field-wrapper>
      <cica-form-field-wrapper label="Users">
      @let users = (users$ | async) ?? [];
      <app-select
        [id]="'users'"
        [multiple]="true"
        [items]="users"
        [bindLabel]="'fullName'"
        [openOnEnter]="true"
        [attr.id]="'users'"
        [formField]="form.users"
        [placeholder]="'Select users'"
        [clearable]="false"
        [clearOnBackspace]="false"
      />
      </cica-form-field-wrapper>
   
</form>

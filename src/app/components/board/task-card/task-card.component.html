<cica-card [cardTitle]="task().title">
  <cica-badge
    slot="cardTitle"
    [type]="taskSeverityClass()"
    >{{ task().taskPriority }}</cica-badge>
  <ng-content slot="conrent">
    <p>{{ task().description }}</p>
    <div class="flex flex-column justify-content-space-between margin-top-md">
      @let users = task().users;
      <cica-avatar-group>
        @for (user of users | slice: 0 : maxVisibleImages; track user.id) {
          <cica-avatar
            class="cursor-pointer"
            [cicaTooltip]="user.fullName"
            [size]="'sm'"
            [tooltipPosition]="'top'"
          >{{user.fullName | slice: 0:1}}
          </cica-avatar>
        }
        @let length = users.length;
        @if (length > maxVisibleImages) {
          <cica-avatar />
        }
      </cica-avatar-group>

      <cica-menu-button [(isOpen)]="isOpen" [position]="'right'">
        <cica-ui-list (click)="isOpen.set(false)">
          <cica-ui-list-item
            [button]="true"
            [headerText]="'Edit task'"
            cicaModal
            [confirmLabel]="'Edit'"
            [initValue]="task()"
            (onSuccess)="onEdit.emit(this.task())"
            class="cursor-pointer"
          >
           <span slot="start" class="material-symbols-rounded">edit</span>

            <strong>Edit</strong>
          </cica-ui-list-item>

          <cica-ui-list-item
            [button]="true"
            [headerText]="'Are you sure?'"
            [isDelete]="true"
            [cicaModal]="'Delete task with id ' + task().id + '?'"
            [confirmLabel]="'Delete'"
            class="cursor-pointer"
            (onConfirm)="deleteTask()"
          >
            <span slot="start" class="material-symbols-rounded">delete</span>
            <strong>Delete</strong>
          </cica-ui-list-item>
        </cica-ui-list>
      </cica-menu-button>
    </div>
  </ng-content>
</cica-card>

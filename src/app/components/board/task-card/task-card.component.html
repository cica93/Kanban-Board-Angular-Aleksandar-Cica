<ion-card class="flex flex-column cursor-move w-full gap-2">
  <ion-card-header class="flex flex-row justify-content-between align-items-center">
    <ion-card-title id="title-{{ task().id }}">{{ task().title }} </ion-card-title>
    <ion-badge [color]="taskSeverityClass()">{{ task().taskPriority }}</ion-badge>
  </ion-card-header>
  <ion-card-content>
    <p
      id="description-{{ task().id }}"
      class="text-600"
    >
      {{ task().description }}
    </p>
    <div class="flex justify-content-between align-items-center">
      @let users = task().users ?? [];
      <app-avatar-group>
        @for (user of users | slice: 0 : maxVisibleImages; track user.id) {
          <app-avatar
            id="avatar-group"
            [matTooltip]="user.fullName"
            [matTooltipPosition]="'below'"
            [label]="user.fullName | slice: 0 : 1"
            [size]="24"
          />
        }
        @let length = users.length;
        @if (length > maxVisibleImages) {
          <app-avatar
            label="+ {{ length - maxVisibleImages }}"
            [size]="24"
          />
        }
      </app-avatar-group>
      <ion-button
        size="small"
        fill="clear"
        (click)="openMenu($event)"
        [shape]="'round'"
      >
        <ion-icon
          slot="icon-only"
          [icon]="ellipsisVerticalCircleIcon"
        ></ion-icon>
      </ion-button>
    </div>
  </ion-card-content>
</ion-card>
<ion-popover
  [isOpen]="menuOpen()"
  [event]="menuEvent()"
  (didDismiss)="menuOpen.set(false)"
>
  <ng-template>
    <ion-list>
      <ion-item
        button
        (click)="onEdit.emit(this.task())"
      >
        <ion-icon
          slot="start"
          [icon]="createOutlineIcon"
        ></ion-icon>
        <ion-label>Edit</ion-label>
      </ion-item>

      <ion-item
        button
        (click)="onDelete.emit(this.task())"
      >
        <ion-icon
          slot="start"
          [icon]="trashOutlineIcon"
        ></ion-icon>
        <ion-label>Delete</ion-label>
      </ion-item>
    </ion-list>
  </ng-template>
</ion-popover>

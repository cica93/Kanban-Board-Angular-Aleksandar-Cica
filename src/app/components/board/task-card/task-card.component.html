<mat-card class="flex flex-column cursor-move w-full gap-2"> 
  <mat-card-header class="flex flex-row justify-content-between align-items-center">
    <mat-card-title id="title-{{task().id}}">{{task().title}} </mat-card-title>
    <span class="task-card-badge {{taskSeverityClass()}}">{{task().taskPriority}}</span>
  </mat-card-header>
  <mat-card-content>
  <p id="description-{{task().id}}" class="text-600">{{task().description}}</p>
  <div class="flex justify-content-between align-items-center">
    <app-avatar-group>
      @let users = task().users;
      @for (user of users | slice: 0 : maxVisibleImages; track user.id ) {
        @let fullName = user.fullName;
        <app-avatar 
          [matTooltip]="fullName" 
          [matTooltipPosition]="'below'"  
          [label]="fullName | slice: 0:1"  
          size]="24" 
        />
      }
      @let length = users.length;
      @if (length > maxVisibleImages) {
        <app-avatar label="+ {{length - maxVisibleImages}}"  [size]="24" />
      }
    </app-avatar-group>
    <button matIconButton [matMenuTriggerFor]="menu">
      <mat-icon>more_vert</mat-icon>
    </button>
  </div>
  </mat-card-content>
</mat-card>
<mat-menu #menu="matMenu">
  <button mat-menu-item (click)="onEdit.emit(this.task())">
    <mat-icon>edit</mat-icon>
    <span>Edit</span>
  </button>
  <button mat-menu-item (click)="onDelete.emit(this.task())">
    <mat-icon>delete</mat-icon>
    <span>Delete</span>
  </button>
</mat-menu>

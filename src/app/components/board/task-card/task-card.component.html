<cica-card [cardTitle]="task().title">
  <ion-badge
    slot="cardTitle"
    [color]="taskSeverityClass()"
    >{{ task().taskPriority }}</ion-badge
  >
  <ng-content slot="conrent">
    <p>{{ task().description }}</p>
    <div class="flex flex-column justify-content-space-between margin-top-md">
      @let users = task().users;
      <app-avatar-group>
        @for (user of users | slice: 0 : maxVisibleImages; track user.id) {
          <ion-avatar
            [cicaTooltip]="user.fullName"
            [tooltipPosition]="'top'"
            class="avatar cursor-pointer"
          >
            {{ user.fullName | slice: 0 : 1 }}
          </ion-avatar>
        }
        @let length = users.length;
        @if (length > maxVisibleImages) {
          <ion-avatar>{{ length - maxVisibleImages }}</ion-avatar>
        }
      </app-avatar-group>

      <cica-menu-button
        [isOpen]="menuOpen()"
        [isHidden]="menuIsHidden()"
        (dropdownTrigger)="openMenuEvent.emit(); menuIsHidden.set(false)"
      >
        <cica-ui-list (click)="menuIsHidden.set(true)">
          <cica-ui-list-item
            [button]="true"
            [headerText]="'Edit task'"
            cicaModal
            [confirmLabel]="'Edit'"
            [initValue]="task()"
            (onSuccess)="onEdit.emit(this.task())"
            (onCancel)="onCancel()"
            (modalOpenEvent)="modalOpenEvent($event)"
            class="cursor-pointer"
          >
            <span slot="start">
              <ion-icon
                slot="start"
                [icon]="createOutlineIcon"
              ></ion-icon>
            </span>

            <strong>Edit</strong>
          </cica-ui-list-item>

          <cica-ui-list-item
            [button]="true"
            [headerText]="'Are you sure?'"
            [isDelete]="true"
            [cicaModal]="'Delete task with id ' + task().id + '?'"
            [confirmLabel]="'Delete'"
            class="cursor-pointer"
            (onConfirm)="deleteTask()"
            (onCancel)="onCancel()"
            (modalOpenEvent)="modalOpenEvent($event)"
          >
            <span slot="start">
              <ion-icon
                slot="start"
                [icon]="trashOutlineIcon"
              ></ion-icon>
            </span>

            <strong>Delete</strong>
          </cica-ui-list-item>
        </cica-ui-list>
      </cica-menu-button>
    </div>
  </ng-content>
</cica-card>

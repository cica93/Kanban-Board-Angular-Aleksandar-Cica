<div class="padding-16">
  <div class="serach-wrapper">
    <app-search-input
      [value]="searchValue()"
      (valueChange)="changeSearchValue($event)"
      [placeholder]="'Search'"
    />
    <ion-button
      [headerText]="'Create task'"
      cicaModal
      [confirmLabel]="'Create'"
      class="cursor-pointer"
      (onSuccess)="onCreate()"
    >
      <ion-icon
        slot="start"
        [icon]="addIcon"
      ></ion-icon>
      Create Task
    </ion-button>
  </div>
  @let loading = tasksQuery.isLoading();
  @if (loading) {
    <div
      class="fixed top-50 left-50 align-items-center justify-content-center"
      style="z-index: 100"
    >
      <ion-spinner></ion-spinner>
    </div>
  } @else {
    <div
      style="overflow-y: auto; max-height: 80vh"
      #mainContainer
    >
      <cica-collections [items]="TASK_STATUSES">
        <ng-template
          #itemTemplate
          let-item="item"
          let-index="index"
        >
          @let tasksByStatus = tasks()[index]?.tasks ?? [];
          <h2 class="text-center">
            {{ item }}
          </h2>
          <div
            cdkDropList
            [id]="item"
            [cdkDropListData]="tasksByStatus"
            [cdkDropListConnectedTo]="TASK_STATUSES"
            (cdkDropListDropped)="onDrop($event, item)"
          >
            <cica-collections
              [items]="tasksByStatus"
              [columns]="1"
            >
              <ng-template
                #itemTemplate
                let-item="item"
              >
                <app-task-card
                  cdkDrag
                  cdkDragBoundary="#main-container"
                  [menuOpen]="menuIsOpen()[item.id] ?? false"
                  (openMenuEvent)="openMenu(item.id)"
                  (dismissMenuEvent)="dismissMenu()"
                  [cdkDragData]="item"
                  [task]="item"
                  (onDelete)="deleteTask($event)"
                  (onEdit)="onEdit()"
                />
              </ng-template>
            </cica-collections>
          </div>
        </ng-template>
      </cica-collections>

      <div
        (cicaBecomeVisible)="loadMore()"
        [threshold]="0.5"
        style="visibility: hidden; transform: translateY(-40px); z-index: 100"
      ></div>
    </div>
  }
  <app-scroll-top />
</div>

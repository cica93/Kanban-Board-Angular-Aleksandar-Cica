<div class="setup-container">
  <fieldset>
    <legend>Sidebar position</legend>
    <div class="radio-container">
      <input
        id="position-left"
        name="position"
        type="radio"
        (input)="setHtmlProperty('position', 'left')"
      />
      <label for="position-left">Left</label>
    </div>
    <div class="radio-container">
      <input
        id="position-top"
        name="position"
        type="radio"
        (input)="setHtmlProperty('position', 'top')"
      />
      <label for="position-top">Top</label>
    </div>
  </fieldset>
  <fieldset>
    <legend>Sidebar size</legend>
    <div class="radio-container">
      <input
        id="size-sm"
        name="size"
        type="radio"
        (input)="setHtmlProperty('size', 'sm')"
      />
      <label for="size-sm">Small</label>
    </div>
    <div class="radio-container">
      <input
        id="size-md"
        name="size"
        type="radio"
        (input)="setHtmlProperty('size', 'md')"
      />
      <label for="size-md">Medium</label>
    </div>
    <div class="radio-container">
      <input
        id="size-lg"
        name="size"
        type="radio"
        (input)="setHtmlProperty('size', 'lg')"
      />
      <label for="size-lg">Large</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Sidebar theme</legend>
    <div class="radio-container">
      <input
        name="theme"
        id="theme-light"
        type="radio"
        (input)="setHtmlProperty('theme', 'light')"
      />
      <label for="theme-light">Light</label>
    </div>
    <div class="radio-container">
      <input
        name="theme"
        type="radio"
        id="theme-dark"
        (input)="setHtmlProperty('theme', 'dark')"
      />
      <label for="theme-dark">Dark</label>
    </div>
  </fieldset>
</div>

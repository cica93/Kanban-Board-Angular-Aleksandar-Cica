<ion-grid>
  <ion-row>
    <ion-col class="margin-x-md">
      <div
        class="grid-wrapper"
        style="width: 700px; height: 100%;"
        (contextmenu)="$event.preventDefault()"
      >
        <app-ag-grid-wrapper
          [columnDefs]="columnDefs"
          (onCellContextMenu)="onCellContextMenu($event)"
          (onRowClicked)="onRowClicked($event)"
        />
      </div>
    </ion-col>
  </ion-row>
</ion-grid>
<ion-popover
  [isOpen]="contentMenuOpen()"
  [event]="contentMenuEvent()"
  [side]="'right'"
  (didDismiss)="contentMenuOpen.set(false)"
>
  <ion-list>
    <ion-item
      class="cursor-pointer"
      (click)="editUser()"
    >
      <ion-icon
        slot="start"
        [icon]="createOutlineIcon"
      ></ion-icon>
      <ion-label>Edit</ion-label>
    </ion-item>

    <ion-item
      class="cursor-pointer"
      (click)="deleteUser()"
    >
      <ion-icon
        slot="start"
        [icon]="trashOutlineIcon"
      ></ion-icon>
      <ion-label>Delete</ion-label>
    </ion-item>
  </ion-list>
</ion-popover>

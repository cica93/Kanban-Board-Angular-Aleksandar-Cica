<ion-grid>
  <ion-row>
    <ion-col class="margin-x-md">
      <div class="grid-wrapper" style="width: 700px; max-height: 120px;"  (contextmenu)="$event.preventDefault()">
        <ag-grid-angular
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [rowModelType]="'infinite'"
          [animateRows]="true"
          [domLayout]="'autoHeight'"
          [pagination]="true"
          [paginationPageSize]="5"
          [cacheBlockSize]="10"
          [maxBlocksInCache]="1"
          [paginationPageSizeSelector]="[5, 10, 25, 50, 100]"
          (cellContextMenu)="onCellContextMenu($event)"
          (rowClicked)="onRowClicked($event)"
          (gridReady)="onGridReady($event)"
        />
      </div>
    </ion-col>
  </ion-row>
</ion-grid>
<ion-popover
  [isOpen]="contentMenuOpen()"
  [event]="contentMenuEvent()"
  [side]="'right'"
  (didDismiss)="contentMenuOpen.set(false)"
>
    <ion-list>
      <ion-item
        class="cursor-pointer"
        (click)="editUser()"
      >
        <ion-icon
          slot="start"
          [icon]="createOutlineIcon"
        ></ion-icon>
        <ion-label>Edit</ion-label>
      </ion-item>

      <ion-item
        class="cursor-pointer"
        (click)="deleteUser()"
      >
        <ion-icon
          slot="start"
          [icon]="trashOutlineIcon"
        ></ion-icon>
        <ion-label>Delete</ion-label>
      </ion-item>
    </ion-list>
</ion-popover>

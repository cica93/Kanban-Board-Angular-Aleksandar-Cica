
 @let streetFiled = addressFields().street;
<cica-input 
      [cicaFirstFocus]="true"
      [errorMessage]="streetFiled().errors()[0]?.message ?? ''"
      [attr.id]="'street'"
      [label]="'Street'"
      [formField]="streetFiled" />
@let zipCodeFiled = addressFields().zipCode;
<cica-input
      [attr.id]="'zip-code'"
      [label]="'Zip Code'"
      [formField]="zipCodeFiled"
      [errorMessage]="zipCodeFiled().errors()[0]?.message ?? ''"
    />
     @let cityFiled = addressFields().city;
<cica-input
      [attr.id]="'city'"
      [label]="'City'"
      [errorMessage]="cityFiled().errors()[0]?.message ?? ''"
      [formField]="cityFiled"
    />

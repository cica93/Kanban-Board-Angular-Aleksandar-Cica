<ion-grid class="full-height">
  <ion-row class="center-content">
    <ion-col
      size="10"
      size-md="6"
      size-lg="4"
    >
      <form [formRoot]="loginForm">
        <h1 style="text-align: center">Login</h1>
        <ion-list class="form-group">
          <ion-item>
            <ion-input
              fill="solid"
              errorText="ssss"
              helperText="Enter a valid email"
              labelPlacement="floating"
              label="Email"
              placeholder="Enter email"
              [formField]="loginForm.email"
              [appFirstFocus]="true"
              class="w-full"
              email
              id="email"
            />
          </ion-item>

          <ion-item>
            <ion-input
              fill="solid"
              errorText="asdad"
              helperText="Enter a valid password"
              type="password"
              label="Password"
              [formField]="loginForm.password"
              labelPlacement="floating"
              class="w-full"
              id="password"
            >
              <ion-input-password-toggle slot="end" />
            </ion-input>
          </ion-item>
        </ion-list>

        @let submitting = loginForm().submitting();
        <ion-button
          expand="block"
          [disabled]="submitting"
          type="submit"
        >
          {{ submitting ? 'Logging in...' : 'Login' }}

          @if (submitting) {
            <ion-spinner name="crescent" />
          }
        </ion-button>
      </form>
    </ion-col>
  </ion-row>
</ion-grid>

<div class="center-content">
  <form [formRoot]="loginForm">
    <h1 style="text-align: center">Login</h1>

    <cica-form-field-wrapper label="Email">
      <cica-input
        placeholder="Enter email"
        [formField]="loginForm.email"
        [autofocus]="true"
        id="email"
      />
    </cica-form-field-wrapper>
    <cica-form-field-wrapper label="Password">
      <cica-input
        inputType="password"
        label="Password"
        [formField]="loginForm.password"
      >
      </cica-input>
    </cica-form-field-wrapper>

    @let submitting = loginForm().submitting();
    <button
      [disabled]="submitting"
      type="submit"
    >
      {{ submitting ? 'Logging in...' : 'Login' }}

      @if (submitting) {
        
      }
    </button>
  </form>
</div>

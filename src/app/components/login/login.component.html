<div class="flex justify-content-center flex-column align-items-center h-screen">
  <div class="form flex flex-column w-3 md:w-4 sm:w-6">    
    <form class="form flex flex-column gap-3" [formRoot]="loginForm">
      <h1 class="text-center">Login</h1>   
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email</mat-label> 
        <input 
          placeholder="Enter email"
          [formField]="loginForm.email"
          [appFirstFocus]="true"
          matInput
          id="email"
          styleClass="full-width"/>
           @if(loginForm.email().errors()){
          <mat-error>
            {{loginForm.email().errors()[0]?.message}}
          </mat-error>
          }
     </mat-form-field>
  
     <mat-form-field appearance="outline" class="w-full">
        <mat-label>Password</mat-label>
        <input
          matInput
          [type]="hidePassword() ? 'password' : 'text'"
          placeholder="Enter password"
          [formField]="loginForm.password"
        />
        <span
          mat-icon-button
          matSuffix
          type="button"
          [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
          [attr.aria-pressed]="!hidePassword()"
          (click)="hidePassword.update(p => !p)"
        >
          <mat-icon>
            {{ hidePassword() ? 'visibility' : 'visibility_off' }}
          </mat-icon>
         
        </span>
         @if(loginForm.password().errors()){
          <mat-error>
            {{loginForm.password().errors()[0]?.message}}
          </mat-error>
          }
      </mat-form-field>
      <div class="mt-3">
        @let submitting = loginForm().submitting();
        <button 
          matButton="filled"
          [disabled]="submitting"
          [type]="'submit'"
          class="mx-2"
          style="width: 100%;">
           {{submitting ? 'Logging in...' : 'Login'}} 
          @if (submitting) { 
            <i class="pi pi-spin pi-spinner"></i> 
          }   
          </button>
      </div>
    </form>
  </div>
</div>

<div class="center-content">
  <form [formRoot]="loginForm">
    <h1 style="text-align: center">Login</h1>

    @let emailInput = loginForm.email();
    <cica-input
      [errorMessage]="emailInput.errors()[0]?.message ?? 'Enter a valid email'"
      label="Email"
      placeholder="Enter email"
      [formField]="loginForm.email"
      [autofocus]="true"
      id="email"
    />

    @let passwordInput = loginForm.password();
    <cica-input
      [errorMessage]="passwordInput.errors()[0]?.message ?? 'Enter a valid password'"
      inputType="password"
      label="Password"
      [formField]="loginForm.password"
    >
    </cica-input>

    @let submitting = loginForm().submitting();
    <button
      [disabled]="submitting"
      type="submit"
    >
      {{ submitting ? 'Logging in...' : 'Login' }}

      @if (submitting) {
        
      }
    </button>
  </form>
</div>

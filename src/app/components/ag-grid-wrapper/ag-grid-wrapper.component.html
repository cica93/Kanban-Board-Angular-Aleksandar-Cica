<ag-grid-angular
  [gridOptions]="gridOptions"
  [columnDefs]="columnDefs()"
  [pagination]="pagination()"
  (cellContextMenu)="handleCellContextMenu($event)"
  (contextmenu)="preventBrowserContextMenu($event)"
  (rowClicked)="onRowClicked.emit($event)"
  [defaultColDef]="defaultColDef"
  [datasource]="datasource"
  [paginationPageSize]="paginationPageSize()"
  [paginationPageSizeSelector]="[10, 25, 50, 100]"
  (gridReady)="onGridReady($event)"
  (paginationChanged)="changePageSize($event)"
/>

@if (contextMenu(); as menu) {
  <div
    class="context-menu-backdrop"
    (click)="closeContextMenu()"
    (contextmenu)="$event.preventDefault()"
  ></div>
  <div
    class="grid-context-menu"
    [style.left.px]="menu.x"
    [style.top.px]="menu.y"
    role="menu"
    aria-label="Grid cell actions"
    (click)="$event.stopPropagation()"
  >
    <div class="menu-item">
      <span>Copy</span>
    </div>
    <div class="menu-item">
      <span>Edit</span>
    </div>
  </div>
}

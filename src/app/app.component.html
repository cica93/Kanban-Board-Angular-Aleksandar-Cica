@if (user$ | async; as user) {
  <ion-grid>
    <ion-row class="user-menu">
      <app-avatar
        class="cursor-pointer"
        [size]="30"
        [label]="user.fullName | slice: 0 : 1"
      />

      <app-link-group>
        @for (item of ['rest', 'graphql', 'users']; track item) {
          <ion-router-link
            [routerLink]="'/' + item"
            routerDirection="root"
          >
            {{ item | titlecase }}
          </ion-router-link>
        }
      </app-link-group>

      <ion-button
        fill="solid"
        shape="round"
        class="logout-button"
        (click)="logout()"
      >
        <ion-icon
          slot="icon-only"
          [icon]="logOutOutlineIcon"
        />
      </ion-button>
    </ion-row>
  </ion-grid>

  <router-outlet />
} @else {
  <router-outlet />
}

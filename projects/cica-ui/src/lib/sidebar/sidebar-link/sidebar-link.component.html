@let hasChildren = linkTemplates().length > 0;
<div
  class="nav-item"
  (click)="linkClicked()"
  [class.dropdown-container]="hasChildren"
>
  <a
    (click)="toggle.next({ event: 'click' })"
    class="nav-link"
    [class.dropdown-toggle]="hasChildren"
  >
    <ng-content select=".link-icon" />
    <span class="nav-label"  [class.no-content]="!labelTemplate() && !label()">
      @if (labelTemplate(); as template) {
    <ng-container
      [ngTemplateOutlet]="template"
    />
  } @else {
    {{label()}}
  }
    </span>
    @if (hasChildren) {
      <span class="dropdown-icon">

<svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24" fill="currentColor">
  <path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
</svg>

      </span>
    }
  </a>
  <div
    class="dropdown-menu"
    [class.open]="isOpen$ | async"
  >
    <div class="">
      @for (childLink of linkTemplates(); track childLink.url()) {
        <div class="nav-item">
          <a
            [routerLink]="childLink.url()"
            routerLinkActive="active"
            class="nav-link dropdown-link"
            >
            <ng-template [ngTemplateOutlet]="childLink.templateRef"></ng-template
          ></a>
        </div>
      } @empty {
        <div class="nav-item">
          <a
            [routerLink]="url()"
            routerLinkActive="active"
            class="nav-link dropdown-link"
            [class.no-content]="!labelTemplate() && !label()"
            >@if (labelTemplate(); as template) {
              <ng-container [ngTemplateOutlet]="template" />
            } @else {
              {{ label() }}
            }</a
          >
        </div>
      }
    </div>
  </div>
</div>

<div
  class="sidebar sidebar-size-{{ size() }} sidebar-position-{{ position() }}"
>
  <div class="sidebar-header">
    <div class="logo-image-wrapper-lg">
      <ng-content select=".logo-image-lg" />
    </div>
    <div class="logo-image-wrapper-sm">
      <ng-content select=".logo-image-sm" />
    </div>
  </div>
  <nav class="sidebar-nav">
  @if(showToggleButton()){
    <span
      (click)="toggleMenu()"
      class="sidebar-toggler"
      aria-label="Toggle Sidebar"
    >
      <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24" fill="currentColor">
        <path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
      </svg>
    </span>
  }
  <ng-content select="cica-sidebar-link" />
  </nav>
</div>

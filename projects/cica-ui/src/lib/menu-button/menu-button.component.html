<div class="dropdown">
  <button
    type="button"
    class="dropdown-trigger"
    (click)="dropdownTrigger.emit()"
    aria-label="Open menu"
    [attr.aria-expanded]="isOpen()"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="currentColor"
      xmlns="http://www.w3.org/2000/svg"
    >
      <circle
        cx="12"
        cy="5"
        r="2"
      />
      <circle
        cx="12"
        cy="12"
        r="2"
      />
      <circle
        cx="12"
        cy="19"
        r="2"
      />
    </svg>
  </button>

  @if (isOpen()) {
    <div class="dropdown-menu" [class.hidden]="isHidden()">
      <ng-content />
    </div>
  }
</div>

<div class="dropdown" (cicaClickOutside)="isOpen.set(false)">
  <div   
    class="dropdown-trigger"
    (click)="isOpen.set(true)"
    aria-label="Open menu"
    [attr.aria-expanded]="isOpen()">
    <ng-container [ngTemplateOutlet]="trigerTempalate() ?? default"></ng-container>
</div>

  @if (isOpen()) {
    <div class="dropdown-menu">
      <ng-content />
    </div>
  }
</div>

<ng-template #default>
    <span>
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="currentColor"
      xmlns="http://www.w3.org/2000/svg"
    >
      <circle
        cx="12"
        cy="5"
        r="2"
      />
      <circle
        cx="12"
        cy="12"
        r="2"
      />
      <circle
        cx="12"
        cy="19"
        r="2"
      />
    </svg>
  </span>
</ng-template>
